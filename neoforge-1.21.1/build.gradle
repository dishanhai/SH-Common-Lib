// Author: dishanhai
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

apply from: '../gradle/library.gradle'

sourceSets.main {
    java.srcDir('../common/src/announcement/java')
    resources.srcDir('../common/src/announcement/resources')
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
    maven { url = 'https://thedarkcolour.github.io/KotlinForForge/'; content { includeGroup 'thedarkcolour' } }
    maven { url = 'https://maven.latvian.dev/releases/'; content { includeGroup 'dev.latvian.mods' } }
    maven { url = 'https://maven.blamejared.com/'; content { includeGroup 'mezz.jei' } }
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}

dependencies {
    implementation files(findProperty('shBetterUiJar')
            ?: "../../SH-Better-UI/neoforge-1.21.1/build/libs/sh_better_ui-neoforge-${minecraft_version}-${sh_better_ui_version}.jar")
    runtimeOnly 'thedarkcolour:kotlinforforge-neoforge:5.10.0'
    // Optional ULK integrations; these mods remain separate runtime dependencies.
    compileOnly('maven.modrinth:vvuO3ImH:yohfFbgD') { transitive = false }
    compileOnly('maven.modrinth:TyCTlI4b:tJnK2DE1') { transitive = false }
    compileOnly('maven.modrinth:nmoqTijg:ceT6tucA') { transitive = false }
    compileOnly('dev.latvian.mods:kubejs-neoforge:2101.7.2-build.381') { transitive = false }
    compileOnly('dev.latvian.mods:rhino:2101.2.7-build.81') { transitive = false }
    compileOnly('mezz.jei:jei-1.21.1-neoforge:19.69.0.456') { transitive = false }
    compileOnly('maven.modrinth:ae2:19.2.18') { transitive = false }
    if (findProperty('mekanismJar')) {
        compileOnly files(property('mekanismJar'))
    } else {
        compileOnly('maven.modrinth:Ce6I4WUE:5KzzycBT') { transitive = false } // Mekanism 10.7.19.85
    }
    if (findProperty('appliedMekanisticsJar')) {
        compileOnly files(property('appliedMekanisticsJar'))
    } else {
        compileOnly('maven.modrinth:IiATswDj:TpUCzFaW') { transitive = false } // Applied Mekanistics 1.6.3
    }
}

neoForge {
    version = platform_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods {
        sh_common_lib { sourceSet sourceSets.main }
    }
}
