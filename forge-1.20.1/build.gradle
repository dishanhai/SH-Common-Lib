// Author: dishanhai
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

apply from: '../gradle/library.gradle'

sourceSets.main {
    java.srcDir('../common/src/announcement/java')
    resources.srcDir('../common/src/announcement/resources')
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.blamejared.com/'; content { includeGroup 'mezz.jei' } }
    maven { url = 'https://maven.latvian.dev/releases/'; content { includeGroup 'dev.latvian.mods' } }
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${platform_version}"
    implementation files(findProperty('shBetterUiJar')
            ?: "../../SH-Better-UI/build/libs/sh_better_ui-${sh_better_ui_version}-dev.jar")
    runtimeOnly files(findProperty('kotlinForForgeJar')
            ?: '../../SH-Better-UI/libs/kotlinforforge-4.12.0-all.jar')
    // Optional ULK integrations; these mods remain separate runtime dependencies.
    compileOnly fg.deobf('maven.modrinth:vvuO3ImH:IPQlZkz1') // Curios 5.14.1
    compileOnly fg.deobf('maven.modrinth:TyCTlI4b:xviLgqVd') // Sophisticated Backpacks 3.26.20
    compileOnly fg.deobf('maven.modrinth:nmoqTijg:FrNTdGKb') // Sophisticated Core 1.5.30
    compileOnly fg.deobf('maven.modrinth:Ce6I4WUE:uxe1WQp4') // Mekanism 10.4.16
    compileOnly('dev.latvian.mods:kubejs-forge:2001.6.5-build.26') { transitive = false }
    compileOnly('dev.latvian.mods:rhino-forge:2001.2.3-build.10') { transitive = false }
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-common-api:15.49.0.200')
    if (findProperty('ae2Jar')) {
        compileOnly files(property('ae2Jar'))
    } else {
        compileOnly fg.deobf('maven.modrinth:XxWD5pD3:7KVs6HMQ') // AE2 Forge 15.4.10
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        configureEach {
            workingDirectory file("run/${name}")
            mods { sh_common_lib { source sourceSets.main } }
        }
        client { arg '-mixin.config=sh_common_lib.loading.mixins.json' }
        server { args '--nogui' }
    }
}

tasks.named('jar') {
    manifest.attributes('MixinConfigs': 'sh_common_lib.loading.mixins.json')
    finalizedBy 'reobfJar'
}
