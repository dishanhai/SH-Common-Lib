// Author: dishanhai
group = 'com.dishanhai'
version = '0.4.0'

def libraryArtifact = "sh-common-lib-${platform}-${minecraft_version}"
base { archivesName = libraryArtifact }
java { withSourcesJar() }

sourceSets.main {
    java.srcDir('../common/src/main/java')
    resources.srcDir('../common/src/main/resources')
}

sourceSets {
    controlCenterVerification {
        java.srcDir('../common/src/test/java')
        compileClasspath += sourceSets.main.output
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output
    }
}

tasks.register('controlCenterDraftTest', JavaExec) {
    group = 'verification'
    description = 'Checks staged control center settings, reset, retry, and HUD editor merging.'
    classpath = sourceSets.controlCenterVerification.runtimeClasspath
    mainClass = 'com.dishanhai.sh_common_lib.client.control.ControlCenterDraftTest'
}

tasks.register('artisanSettingsTest', JavaExec) {
    group = 'verification'
    description = 'Checks independent Artisan enable settings and preservation during edits.'
    classpath = sourceSets.controlCenterVerification.runtimeClasspath
    mainClass = 'com.dishanhai.sh_common_lib.internal.item.ArtisanSettingsTest'
}

tasks.register('cosmicArtisanGestureTest', JavaExec) {
    group = 'verification'
    description = 'Checks tap and hold timing and cancellation for the Cosmic Artisan shortcut.'
    classpath = sourceSets.controlCenterVerification.runtimeClasspath
    mainClass = 'com.dishanhai.sh_common_lib.client.item.CosmicArtisanGestureTest'
}

tasks.register('clientSearchTest', JavaExec) {
    group = 'verification'
    description = 'Checks ULK client search and suggestion results.'
    javaLauncher = javaToolchains.launcherFor { languageVersion = project.java.toolchain.languageVersion }
    classpath = sourceSets.controlCenterVerification.runtimeClasspath + sourceSets.main.runtimeClasspath
    mainClass = 'com.dishanhai.sh_common_lib.api.client.ulk.ClientSearchTest'
}

tasks.register('searchHistoryTest', JavaExec) {
    group = 'verification'
    description = 'Checks bounded local search history and persistence.'
    javaLauncher = javaToolchains.launcherFor { languageVersion = project.java.toolchain.languageVersion }
    classpath = sourceSets.controlCenterVerification.runtimeClasspath
    mainClass = 'com.dishanhai.sh_common_lib.api.client.ulk.SearchHistoryTest'
}

tasks.register('jeiSearchSettingsTest', JavaExec) {
    group = 'verification'
    description = 'Checks JEI search setting persistence and invalid values.'
    javaLauncher = javaToolchains.launcherFor { languageVersion = project.java.toolchain.languageVersion }
    classpath = sourceSets.controlCenterVerification.runtimeClasspath + sourceSets.main.runtimeClasspath
    mainClass = 'com.dishanhai.sh_common_lib.client.jei.JeiSearchSettingsTest'
}

tasks.register('searchCompletionUndoTest', JavaExec) {
    group = 'verification'
    description = 'Checks completion undo and invalidation after editing.'
    classpath = sourceSets.controlCenterVerification.runtimeClasspath
    mainClass = 'com.dishanhai.sh_common_lib.client.jei.SearchCompletionUndoTest'
}

tasks.register('recipePreviewBoundsTest', JavaExec) {
    group = 'verification'
    description = 'Checks title and JEI drawable border separation in recipe previews.'
    classpath = sourceSets.controlCenterVerification.runtimeClasspath
    mainClass = 'com.dishanhai.sh_common_lib.client.jei.RecipePreviewBoundsTest'
}

tasks.register('jeiSearchLayoutTest', JavaExec) {
    group = 'verification'
    description = 'Checks readable JEI candidates across AE terminal sizes.'
    classpath = sourceSets.controlCenterVerification.runtimeClasspath + sourceSets.main.runtimeClasspath
    mainClass = 'com.dishanhai.sh_common_lib.client.jei.JeiSearchLayoutTest'
}

tasks.register('searchGiveShortcutTest', JavaExec) {
    group = 'verification'
    description = 'Checks JEI give key combinations, stack amounts and cheat-mode gating.'
    classpath = sourceSets.controlCenterVerification.runtimeClasspath
    mainClass = 'com.dishanhai.sh_common_lib.client.jei.SearchGiveShortcutTest'
}

tasks.register('searchPagingTest', JavaExec) {
    group = 'verification'
    description = 'Checks JEI candidate page and selection boundaries.'
    classpath = sourceSets.controlCenterVerification.runtimeClasspath
    mainClass = 'com.dishanhai.sh_common_lib.client.jei.SearchPagingTest'
}

tasks.register('inventoryScanTrackerTest', JavaExec) {
    group = 'verification'
    description = 'Checks ULK storage identity, bounded traversal and count overflow.'
    classpath = sourceSets.controlCenterVerification.runtimeClasspath
    mainClass = 'com.dishanhai.sh_common_lib.internal.ulk.InventoryScanTrackerTest'
}

def ulkVerificationClasses = layout.buildDirectory.dir('classes/ulkVerification')
tasks.register('compileUlkVerification', JavaCompile) {
    source files('../common/src/test/ulk-fixtures/net/minecraft/world/item/ItemStack.java',
            '../common/src/test/ulk-verification/com/dishanhai/sh_common_lib/api/ulk/InventorySnapshotTest.java',
            '../common/src/main/java/com/dishanhai/sh_common_lib/internal/ulk/InventoryScanTracker.java',
            '../common/src/main/java/com/dishanhai/sh_common_lib/api/ulk/InventorySource.java',
            '../common/src/main/java/com/dishanhai/sh_common_lib/api/ulk/InventoryEntry.java',
            '../common/src/main/java/com/dishanhai/sh_common_lib/api/ulk/InventorySnapshot.java',
            '../common/src/main/java/com/dishanhai/sh_common_lib/api/ulk/InventoryScan.java')
    classpath = files()
    destinationDirectory = ulkVerificationClasses
}

tasks.register('inventorySnapshotTest', JavaExec) {
    group = 'verification'
    description = 'Checks ULK snapshot copying, source status, totals and bounds with isolated item fixtures.'
    dependsOn tasks.named('compileUlkVerification')
    classpath = files(ulkVerificationClasses)
    mainClass = 'com.dishanhai.sh_common_lib.api.ulk.InventorySnapshotTest'
}

tasks.named('check') {
    dependsOn 'jeiSearchLayoutTest'
    dependsOn 'recipeEditorTest', 'recipeImporterTest', 'brewingDefinitionsTest', 'brewingDatapackTest', 'brewingApiTest', 'brewingRuleCacheTest'
    dependsOn tasks.named('searchGiveShortcutTest'), tasks.named('cosmicArtisanGestureTest'), tasks.named('artisanSettingsTest'), tasks.named('controlCenterDraftTest'), tasks.named('clientSearchTest'), tasks.named('searchHistoryTest'), tasks.named('jeiSearchSettingsTest'), tasks.named('searchCompletionUndoTest'), tasks.named('recipePreviewBoundsTest'), tasks.named('searchPagingTest'), tasks.named('inventoryScanTrackerTest'), tasks.named('inventorySnapshotTest')
}

tasks.register('recipeEditorTest', JavaExec) {
    group = 'verification'
    description = 'Checks versioned recipe JSON, KubeJS and Java exports, drafts and safe file writes.'
    classpath = sourceSets.controlCenterVerification.runtimeClasspath + sourceSets.main.runtimeClasspath
    mainClass = 'com.dishanhai.sh_common_lib.api.ulk.recipe.RecipeGeneratorTest'
}

tasks.register('recipeImporterTest', JavaExec) {
    group = 'verification'
    description = 'Checks lossless vanilla JSON import and preservation of unsupported recipe fields.'
    classpath = sourceSets.controlCenterVerification.runtimeClasspath + sourceSets.main.runtimeClasspath
    mainClass = 'com.dishanhai.sh_common_lib.api.ulk.recipe.RecipeImporterTest'
}

tasks.register('brewingDefinitionsTest', JavaExec) {
    group = 'verification'
    description = 'Checks brewing config parsing, damaged-file isolation and duplicate identifiers.'
    classpath = sourceSets.controlCenterVerification.runtimeClasspath + sourceSets.main.runtimeClasspath
    mainClass = 'com.dishanhai.sh_common_lib.internal.recipe.BrewingDefinitionTest'
}

tasks.register('brewingDatapackTest', JavaExec) {
    group = 'verification'
    description = 'Checks brewing data-pack resource loading, reload replacement and config precedence.'
    classpath = sourceSets.controlCenterVerification.runtimeClasspath + sourceSets.main.runtimeClasspath
    mainClass = 'com.dishanhai.sh_common_lib.internal.recipe.BrewingDatapackTest'
}

tasks.register('brewingApiTest', JavaExec) {
    group = 'verification'
    description = 'Checks public brewing registration, replacement, validation and concurrent snapshots.'
    classpath = sourceSets.controlCenterVerification.runtimeClasspath + sourceSets.main.runtimeClasspath
    mainClass = 'com.dishanhai.sh_common_lib.api.ulk.recipe.BrewingRecipesTest'
}

tasks.register('brewingRuleCacheTest', JavaExec) {
    group = 'verification'
    description = 'Checks server rule precedence and live registration updates.'
    classpath = sourceSets.controlCenterVerification.runtimeClasspath + sourceSets.main.runtimeClasspath
    mainClass = 'com.dishanhai.sh_common_lib.internal.recipe.BrewingRuleCacheTest'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor { languageVersion = project.java.toolchain.languageVersion }
}

tasks.named('processResources') {
    def metadata = [mod_version: project.version, minecraft_version: minecraft_version,
                    loader_version: platform_version, sh_better_ui_version: sh_better_ui_version]
    inputs.properties(metadata)
    filteringCharset = 'UTF-8'
    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand(metadata)
    }
}

publishing {
    publications {
        library(MavenPublication) {
            artifactId = libraryArtifact
            artifact(tasks.named('jar')) {
                if (platform == 'forge') {
                    builtBy { tasks.named('reobfJar') }
                }
            }
            artifact(tasks.named('sourcesJar'))
            pom {
                name = 'SH-Common-Lib'
                description = 'Shared Minecraft mod APIs, items, and blocks.'
                url = 'https://github.com/dishanhai/SH-Common-Lib'
            }
        }
    }
}

// Responsive editor geometry is shared by every supported loader.
tasks.register('recipeEditorLayoutTest', JavaExec) {
    group = 'verification'
    classpath = sourceSets.controlCenterVerification.runtimeClasspath
    mainClass = 'com.dishanhai.sh_common_lib.client.recipe.RecipeEditorLayoutTest'
}
tasks.named('check') { dependsOn 'recipeEditorLayoutTest' }
